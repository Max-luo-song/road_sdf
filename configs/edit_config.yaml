legend: # render legend to link instance and instance id
  rigid: false
  smpl: false
save_ckpt: true  # 设为 true 则将编辑后的场景保存为 checkpoint_final.pth 到视频输出目录
weather_type: ""
Nodes:
  RigidNodes:
    trajectory_edit:
      instance_id: [1]
      offset_windows:
        - [[0, 20, [0, 3, 0]], [20, 40, [0, -3, 0]]]  # instance 1 的窗口: [start_frame, end_frame, [dx,dy,dz]]
    add:
      ref_id: [-1]
      add_obj: ["/nas_thoru/oldbak/lcy/asset/car_sample_van.ply"]
      waypoints: 
        - - [0, -3, -0.2]
          - [2, -1, -0.2]
          - [4, 2, -0.2]
          - [6, 0, -0.2]
          - [12, 0, -0.2]
      method: ["cubic"]
      time_window:
        - [20, 80]
      color_correct: true   # 开启色差修正，不写或 false 则跳过
      brightness_radius: 5.0   # 3D 空间查询半径（米），不写默认 3.0
